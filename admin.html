<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menu Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="admin-page">

    <h1>Διαχείριση QR Menu</h1>

    <form id="productForm" class="admin-form">

      <label for="category_id">Κατηγορία</label>
      <select id="category_id" required>
        <option value="">Φόρτωση κατηγοριών...</option>
      </select>

      <label for="name">Όνομα προϊόντος</label>
      <input type="text" id="name" required placeholder="π.χ. Freddo Espresso">

      <label for="description">Περιγραφή</label>
      <textarea id="description" placeholder="π.χ. Διπλός espresso με πάγο"></textarea>

      <label for="price">Τιμή</label>
      <input type="number" step="0.01" min="0" id="price" required placeholder="π.χ. 2.50">

      <label for="image_url">Image URL</label>
      <input type="url" id="image_url" placeholder="https://...">

      <button type="submit">Προσθήκη προϊόντος</button>

    </form>

    <div id="message"></div>

  </main>

  <script src="admin.js?v=4"></script>
</body>
</html>
